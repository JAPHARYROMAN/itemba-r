name: Deploy — Production

# Manual only. Never on push: a merge to main should not be able to reach the
# live app on its own, and the whole point of this workflow is that a person
# decides when production changes.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, tag or branch to deploy (must already be on main)'
        required: true
        default: 'main'
      confirm:
        description: 'Type deploy-production to confirm'
        required: true
        default: ''

# One deploy at a time. Two overlapping runs would fight over the same droplet,
# and the second would build images against a half-updated checkout.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to droplet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Add required reviewers to this environment in repo Settings → Environments
    # to make every production deploy need a second pair of eyes. The workflow
    # deliberately does not implement its own approval — GitHub's is auditable
    # and cannot be bypassed by editing this file in a branch.
    environment:
      name: production
      url: https://app.itembagrouptz.com

    steps:
      - name: Check the confirmation phrase
        # A typed phrase, not a boolean, so a deploy cannot happen by clicking
        # through the form on autopilot.
        env:
          REQUESTED_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          if [ "$REQUESTED_CONFIRMATION" != "deploy-production" ]; then
            echo "::error::Confirmation phrase did not match. Type exactly: deploy-production"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve the commit and require it to be on main
        id: resolve
        # Deploying a commit that never landed on main means production runs code
        # no PR gated. Refuse rather than trust the input.
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not an ancestor of origin/main. Only merged code is deployable."
            exit 1
          fi
          echo "Deploying $SHA"

      - name: Require CI to have passed for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        # Only the main-branch push run exercises main-only runtime/deployment
        # gates. A PR run can share the same commit SHA but may legitimately skip
        # those jobs, so it can never authorize production deployment.
        run: |
          SHA="${{ steps.resolve.outputs.sha }}"
          RUN="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$SHA" \
            --workflow 'ITEMBA-R CI' --event push --branch main --status success --limit 1 \
            --json databaseId,conclusion,event,headBranch,headSha,status \
            --jq '.[0] | [.databaseId, .conclusion, .event, .headBranch, .headSha, .status] | @tsv')"
          IFS=$'\t' read -r RUN_ID CONCLUSION EVENT HEAD_BRANCH HEAD_SHA STATUS <<< "$RUN"
          echo "CI push run for $SHA: id=${RUN_ID:-none} status=${STATUS:-none} conclusion=${CONCLUSION:-none}"
          if [ -z "$RUN_ID" ] || [ "$CONCLUSION" != "success" ] || \
             [ "$EVENT" != "push" ] || [ "$HEAD_BRANCH" != "main" ] || \
             [ "$HEAD_SHA" != "$SHA" ] || [ "$STATUS" != "completed" ]; then
            echo "::error::No successful completed ITEMBA-R CI push run on main exists for exact SHA $SHA. Refusing to deploy."
            exit 1
          fi

      - name: Install the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        # Raw ssh rather than a third-party action: this step handles a key that
        # can change production, and a pinned-by-tag marketplace action is a
        # supply-chain dependency this repo does not otherwise carry.
        #
        # known_hosts comes from a secret, not ssh-keyscan. Keyscan trusts
        # whatever answers on the night, which on a deploy channel means a
        # man-in-the-middle gets a root shell on the droplet.
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS must both be set. See the runbook."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
          SHA: ${{ steps.resolve.outputs.sha }}
        # deploy.sh preserves the existing .env.production and named volumes,
        # verifies a pre-migration backup, and skips the full seed by default.
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o TCPKeepAlive=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -se <<EOF
          set -euo pipefail
          cd /opt/itemba-r
          git fetch --all --prune
          git checkout --detach "${SHA}"
          DOMAIN="${DEPLOY_DOMAIN}" bash deploy/relaunch/deploy.sh
          EOF

      - name: Verify the deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ steps.resolve.outputs.sha }}
        # Deploying and confirming are different things. This asserts the commit
        # that is actually checked out, that the API answers, and that Msaidizi
        # is still dark - a config drift that quietly turns an agent on is
        # exactly the failure nobody would notice.
        #
        # EVERY `docker compose exec` below ends in `</dev/null`, and that is not
        # decoration. This script is fed to the remote `bash -s` on STDIN, and
        # `exec` forwards stdin to the container - so without the redirect it
        # consumes THE REST OF THIS SCRIPT as the container's input and the
        # remaining lines never run. On the first production deploy (run
        # 32970113307) that silently ate the whole Msaidizi posture check: no
        # output, no error, step exited 0. A verification step that can skip its
        # own assertions and still pass is worse than no verification at all.
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o TCPKeepAlive=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -se <<'EOF'
          set -euo pipefail
          cd /opt/itemba-r
          COMPOSE="docker compose --env-file .env.production -f docker-compose.production.yml"

          echo "checked out: $(git rev-parse HEAD)"
          $COMPOSE ps

          # The backend's 3001 is deliberately NOT published to the host - only
          # Caddy is exposed - so a host-side curl could never reach it and only
          # produced a misleading "Failed to connect" line on every deploy. Ask
          # the container itself, and print the status so a pass is legible.
          echo "--- health ---"
          $COMPOSE exec -T backend node -e "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{console.log('health HTTP',r.status);process.exit(r.ok?0:1)}).catch(e=>{console.log('health unreachable:',e.message);process.exit(1)})" </dev/null

          echo "--- msaidizi posture ---"
          POSTURE_KEYS='MSAIDIZI_ENABLED MSAIDIZI_AUTONOMY_ENABLED MSAIDIZI_TASK_WORKER_ENABLED MSAIDIZI_AUTOPILOT_ENABLED MSAIDIZI_HOST_EXECUTION_ENABLED MSAIDIZI_ADAPTIVE_REASONING_ENABLED MSAIDIZI_DEVICE_PAIRING_ENABLED MSAIDIZI_DEVICE_CHANNEL_ENABLED MSAIDIZI_DIRECT_MTLS_ENABLED MSAIDIZI_SUPERVISOR_ENROLLMENT_ENABLED MSAIDIZI_UPDATE_SUPERVISOR_ENABLED MSAIDIZI_UPDATE_AUTOMATIC_ROLLOUT_ENABLED MSAIDIZI_UPDATE_EVALUATOR_ENABLED MSAIDIZI_EVALUATOR_MTLS_ENABLED MSAIDIZI_RECOVERY_SUPERVISOR_ENABLED MSAIDIZI_AUDIT_SIGNER_ENABLED'
          for KEY in $POSTURE_KEYS; do
            VALUE="$($COMPOSE exec -T backend printenv "$KEY" </dev/null || echo unset)"
            echo "${KEY}=${VALUE}"
            if [ "$VALUE" != "false" ]; then
              echo "ERROR: production deployment requires ${KEY}=false; refusing unsafe Msaidizi posture." >&2
              exit 1
            fi
          done
          MODE="$($COMPOSE exec -T backend printenv MSAIDIZI_WRITE_MODE </dev/null || echo unset)"
          echo "MSAIDIZI_WRITE_MODE=${MODE}"
          if [ "$MODE" != "read-only" ]; then
            echo "ERROR: production deployment requires MSAIDIZI_WRITE_MODE=read-only; refusing unsafe Msaidizi posture." >&2
            exit 1
          fi
          echo "Msaidizi posture: PASS (all independent switches disabled, read-only)"

          # Prove the script reached its end. Without a sentinel, a future
          # stdin-eating command truncates these checks silently instead of
          # loudly - which is exactly the failure being fixed here.
          echo "--- verification complete ---"
          EOF

      - name: Report
        if: always()
        env:
          REPORT_REF: ${{ inputs.ref }}
          REPORT_COMMIT: ${{ steps.resolve.outputs.sha }}
          REPORT_RESULT: ${{ job.status }}
        run: |
          echo "### Production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- ref: \`$REPORT_REF\`" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- commit: \`$REPORT_COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- result: **$REPORT_RESULT**" >> "$GITHUB_STEP_SUMMARY"
