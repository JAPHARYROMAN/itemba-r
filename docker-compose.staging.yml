# ITEMBA-R Staging Environment
# Usage: docker compose -f docker-compose.staging.yml up -d
# Note: Copy .env.staging.example to .env.staging and fill in staging values

name: itemba-r-staging

services:
  caddy:
    image: caddy:2-alpine
    container_name: itemba_r_caddy_staging
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-info@itembagrouptz.com}
      APP_HOST: ${APP_HOST:-staging.itembagrouptz.com}
      API_HOST: ${API_HOST:-api-staging.itembagrouptz.com}
      WEBSITE_HOST: ${WEBSITE_HOST:-staging-www.itembagrouptz.com}
      WEBSITE_WWW_HOST: ${WEBSITE_WWW_HOST:-www-staging.itembagrouptz.com}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      website:
        condition: service_healthy
    networks:
      - itemba_staging_network
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:2019/config/ >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: itemba_r_postgres_staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itemba_r_staging}
      POSTGRES_USER: ${POSTGRES_USER:-itemba_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    networks:
      - itemba_staging_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-itemba_staging} -d ${POSTGRES_DB:-itemba_r_staging}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: itemba_r_redis_staging
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_staging_data:/data
    networks:
      - itemba_staging_network
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'

  backend-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migration
    container_name: itemba_r_backend_migrate_staging
    restart: 'no'
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgresql://${POSTGRES_USER:-itemba_staging}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-itemba_r_staging}?connection_limit=20&pool_timeout=30
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:?TWO_FACTOR_ENCRYPTION_KEY is required}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?REFRESH_TOKEN_PEPPER is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - itemba_staging_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: itemba_r_backend_staging
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgresql://${POSTGRES_USER:-itemba_staging}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-itemba_r_staging}?connection_limit=20&pool_timeout=30
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-never}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:?TWO_FACTOR_ENCRYPTION_KEY is required}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?REFRESH_TOKEN_PEPPER is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/app/storage}
      BACKUP_STORAGE_PATH: ${BACKUP_STORAGE_PATH:-/app/backups}
      BACKUPS_DIR: ${BACKUPS_DIR:-/app/backups}
      EXPORTS_DIR: ${EXPORTS_DIR:-/app/exports}
      JOB_WORKER_ENABLED: ${JOB_WORKER_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-info@itembagrouptz.com}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_USERNAME: ${AT_USERNAME:-}
      AT_SENDER_ID: ${AT_SENDER_ID:-}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      TIGOPESA_USERNAME: ${TIGOPESA_USERNAME:-}
      TIGOPESA_PASSWORD: ${TIGOPESA_PASSWORD:-}
      AIRTEL_CLIENT_ID: ${AIRTEL_CLIENT_ID:-}
      AIRTEL_CLIENT_SECRET: ${AIRTEL_CLIENT_SECRET:-}
      LOG_LEVEL: debug
    expose:
      - '3001'
    volumes:
      - backend_staging_storage:/app/storage
      - backend_staging_backups:/app/backups
      - backend_staging_exports:/app/exports
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - itemba_staging_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3001/api/v1/health/ready'').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:3001/api/v1}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL:?NEXT_PUBLIC_WEBSITE_URL is required}
        AUTH_COOKIE_MAX_AGE_SECONDS: ${AUTH_COOKIE_MAX_AGE_SECONDS:-315360000}
    container_name: itemba_r_frontend_staging
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side internal URL — Docker bridge, includes API prefix.
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:3001/api/v1}
      # Browser-public URL (used only by client-side code that needs absolute URLs).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      # Public website URL shown from login/signup as the permanent group address.
      NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL:?NEXT_PUBLIC_WEBSITE_URL is required}
      AUTH_COOKIE_MAX_AGE_SECONDS: ${AUTH_COOKIE_MAX_AGE_SECONDS:-315360000}
    expose:
      - '3000'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - itemba_staging_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: itemba_r_website_staging
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    expose:
      - '3001'
    networks:
      - itemba_staging_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3001/api/health'').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
  postgres_staging_data:
  redis_staging_data:
  backend_staging_storage:
  backend_staging_backups:
  backend_staging_exports:

networks:
  itemba_staging_network:
    driver: bridge
